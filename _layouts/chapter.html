---
layout: default
---
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

{%- if page.image -%}
<figure class="chapter-hero">
  <img src="{{ page.image }}" alt="{{ page.image_alt | default: '' }}">
</figure>
{%- endif -%}

<div class="wrapper chapter-page">
  <h1 class="chapter-title">{{ page.title }}</h1>
  <nav class="chapter-nav" aria-label="Chapter navigation">
    <a href="{{ '/' | relative_url }}">&larr; All chapters</a>
  </nav>
  <div class="chapter-content">
    {{ content }}
  </div>

  <nav class="chapter-pagination" aria-label="Previous and next chapter">
    <a href="{{ page.prev_url | relative_url }}" class="chapter-pagination__prev">&larr; {{ page.prev_label }}</a>
    <a href="{{ page.next_url | relative_url }}" class="chapter-pagination__next">{{ page.next_label }} &rarr;</a>
  </nav>
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script>
  Plyr.setup('.chapter-content video', {
    controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
    hideControls: true,
    resetOnEnd: false,
  });
</script>
