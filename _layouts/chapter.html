---
layout: default
---
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

{%- if page.image -%}
<figure class="chapter-hero">
  <img src="{{ page.image }}" alt="{{ page.image_alt | default: '' }}">
</figure>
{%- endif -%}

<div class="wrapper chapter-page">
  <h1 class="chapter-title">{{ page.title }}</h1>
  <nav class="chapter-nav" aria-label="Chapter navigation">
    <a href="{{ '/' | relative_url }}">&larr; All chapters</a>
  </nav>
  <div class="chapter-content">
    {{ content }}
  </div>

  <nav class="chapter-pagination" aria-label="Previous and next chapter">
    <a href="{{ page.prev_url | relative_url }}" class="chapter-pagination__prev">&larr; {{ page.prev_label }}</a>
    <a href="{{ page.next_url | relative_url }}" class="chapter-pagination__next">{{ page.next_label }} &rarr;</a>
  </nav>
</div>

<script>
  // VideoObject structured data for Google video indexing.
  // Runs before Plyr so original src/poster attributes are intact.
  (function() {
    var videos = document.querySelectorAll('.chapter-content video');
    if (!videos.length) return;

    var uploadDate = '{{ page.date | date: "%Y-%m-%dT00:00:00+00:00" }}';
    var pageDesc   = {{ page.description | jsonify }};
    var pageTitle  = {{ page.title | jsonify }};
    var schemas    = [];

    Array.prototype.forEach.call(videos, function(video) {
      // Content URL: prefer src attribute, fall back to first <source>
      var src = video.getAttribute('src');
      if (!src) {
        var s = video.querySelector('source');
        if (s) src = s.getAttribute('src');
      }
      if (!src) return;

      // Thumbnail is required by Google
      var poster = video.getAttribute('poster');
      if (!poster) return;

      // Ensure absolute URLs
      var base = 'https://readingsounds.net';
      if (src.indexOf('//') === 0)    src    = 'https:' + src;
      if (src.charAt(0) === '/')      src    = base + src;
      if (poster.indexOf('//') === 0) poster = 'https:' + poster;
      if (poster.charAt(0) === '/')   poster = base + poster;

      // Walk backward through element siblings to find nearest heading
      var title = pageTitle;
      var el = video.previousElementSibling;
      while (el) {
        if (/^H[1-6]$/.test(el.tagName)) { title = el.textContent.trim(); break; }
        el = el.previousElementSibling;
      }

      schemas.push({
        '@type':        'VideoObject',
        'name':         title,
        'description':  pageDesc,
        'thumbnailUrl': poster,
        'uploadDate':   uploadDate,
        'contentUrl':   src
      });
    });

    if (!schemas.length) return;

    var ld = document.createElement('script');
    ld.type = 'application/ld+json';
    ld.textContent = JSON.stringify({ '@context': 'https://schema.org', '@graph': schemas });
    document.head.appendChild(ld);
  })();
</script>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script>
  Plyr.setup('.chapter-content video', {
    controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'fullscreen'],
    hideControls: true,
    resetOnEnd: false,
  });

  // Inject share bar after the chapter-intro note
  (function() {
    var intro = document.querySelector('.chapter-intro');
    if (!intro) return;
    var url   = encodeURIComponent(window.location.href);
    var title = encodeURIComponent(document.title);
    var bar = document.createElement('div');
    bar.className = 'post-share';
    bar.innerHTML =
      '<span class="post-share-label">Share:</span>' +
      '<a class="post-share-link post-share-bluesky" href="https://bsky.app/intent/compose?text=' + title + '%20' + url + '" target="_blank" rel="noopener noreferrer" aria-label="Share on Bluesky"><i class="fa-brands fa-bluesky" aria-hidden="true"></i></a>' +
      '<a class="post-share-link post-share-twitter" href="https://twitter.com/intent/tweet?url=' + url + '&text=' + title + '" target="_blank" rel="noopener noreferrer" aria-label="Share on Twitter"><i class="fa-brands fa-x-twitter" aria-hidden="true"></i></a>' +
      '<a class="post-share-link post-share-facebook" href="https://www.facebook.com/sharer/sharer.php?u=' + url + '" target="_blank" rel="noopener noreferrer" aria-label="Share on Facebook"><i class="fa-brands fa-facebook-f" aria-hidden="true"></i></a>' +
      '<a class="post-share-link post-share-email" href="mailto:?subject=' + title + '&body=' + url + '" aria-label="Share by email"><i class="fa-solid fa-envelope" aria-hidden="true"></i></a>';
    intro.after(bar);
  })();

  // Inject TOC after share bar
  (function() {
    var headings = document.querySelectorAll('.chapter-content h2[id], .chapter-content h3[id]');
    if (headings.length < 2) return;

    var nav = document.createElement('nav');
    nav.className = 'chapter-toc';
    nav.setAttribute('aria-label', 'Page contents');

    var title = document.createElement('p');
    title.className = 'chapter-toc-title';
    title.textContent = 'On this page';
    nav.appendChild(title);

    var ol = document.createElement('ol');
    ol.className = 'chapter-toc-list';

    Array.prototype.forEach.call(headings, function(h) {
      var li = document.createElement('li');
      if (h.tagName === 'H3') li.className = 'chapter-toc-h3';
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent.trim();
      li.appendChild(a);
      ol.appendChild(li);
    });

    nav.appendChild(ol);

    var bar = document.querySelector('.post-share');
    if (bar) bar.after(nav);
  })();
</script>
