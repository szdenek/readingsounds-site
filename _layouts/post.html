---
layout: default
---
<article class="post-page">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | strip_html }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <nav class="chapter-nav" style="margin-top: 3rem;">
    <a href="{{ '/blog/' | relative_url }}">&larr; All blog posts</a>
  </nav>
</article>
