<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.url == '/' %}{{ site.title }} | {{ site.tagline }}{% elsif page.title and page.title != site.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  {% seo title=false %}
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
  <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header">
    <div class="wrapper">
      <a class="site-title" href="{{ '/' | relative_url }}"><img src="{{ '/assets/images/favicon-32x32.png' | relative_url }}" alt="" aria-hidden="true" class="site-logo" width="28" height="28">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Main navigation">
        <details class="nav-dropdown">
          <summary aria-label="Table of contents">Contents</summary>
          <ul class="nav-dropdown__list">
            <li><a href="{{ '/preface/' | relative_url }}">Preface</a></li>
            <li><a href="{{ '/chapter1/' | relative_url }}">Chapter 1</a></li>
            <li><a href="{{ '/chapter2/' | relative_url }}">Chapter 2</a></li>
            <li><a href="{{ '/chapter3/' | relative_url }}">Chapter 3</a></li>
            <li><a href="{{ '/chapter4/' | relative_url }}">Chapter 4</a></li>
            <li><a href="{{ '/chapter5/' | relative_url }}">Chapter 5</a></li>
            <li><a href="{{ '/chapter6/' | relative_url }}">Chapter 6</a></li>
            <li><a href="{{ '/chapter7/' | relative_url }}">Chapter 7</a></li>
            <li><a href="{{ '/chapter8/' | relative_url }}">Chapter 8</a></li>
            <li><a href="{{ '/chapter9/' | relative_url }}">Chapter 9</a></li>
          </ul>
        </details>
        <a href="https://press.uchicago.edu/ucp/books/book/chicago/R/bo21933882.html">Buy the book</a>
        <a href="{{ '/fair-use-notice/' | relative_url }}">Fair Use</a>
        <button class="search-toggle" aria-label="Open search" aria-expanded="false" aria-controls="site-search-bar">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </nav>
    </div>

    <div class="site-search-bar" id="site-search-bar">
      <form class="site-search-form" action="{{ '/search/' | relative_url }}" method="get" role="search">
        <label for="site-search-input" class="visually-hidden">Search Reading Sounds</label>
        <input type="search" id="site-search-input" name="q" placeholder="Search Reading Sounds…" autocomplete="off" spellcheck="false">
        <button type="submit" class="search-submit" aria-label="Submit search">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        <button type="button" class="search-close" aria-label="Close search">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </form>
    </div>
  </header>

  <main id="main-content" class="page-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrapper">
      <p>&copy; 2015 <a href="https://seanzdenek.com/">Sean Zdenek</a> &nbsp;&middot;&nbsp; <a href="{{ '/fair-use-notice/' | relative_url }}">Fair Use Notice</a> &nbsp;&middot;&nbsp; <a href="{{ '/accessibility-statement/' | relative_url }}">Accessibility</a></p>
    </div>
  </footer>
<script>
  // Search toggle
  (function() {
    var toggle = document.querySelector('.search-toggle');
    var bar = document.getElementById('site-search-bar');
    var input = document.getElementById('site-search-input');
    var close = document.querySelector('.search-close');
    var header = document.querySelector('.site-header');

    if (!toggle || !bar) return;

    function openSearch() {
      var dd = document.querySelector('.nav-dropdown');
      if (dd) dd.open = false;
      header.classList.add('search-open');
      toggle.setAttribute('aria-expanded', 'true');
      setTimeout(function() { input.focus(); }, 50);
    }

    function closeSearch() {
      header.classList.remove('search-open');
      toggle.setAttribute('aria-expanded', 'false');
      toggle.focus();
    }

    toggle.addEventListener('click', function() {
      header.classList.contains('search-open') ? closeSearch() : openSearch();
    });

    close.addEventListener('click', closeSearch);

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && header.classList.contains('search-open')) closeSearch();
    });
  })();

  // Nav dropdown hover
  const dd = document.querySelector('.nav-dropdown');
  if (dd && window.matchMedia('(hover: hover)').matches) {
    let closeTimer;
    dd.addEventListener('mouseenter', () => {
      clearTimeout(closeTimer);
      dd.open = true;
    });
    dd.addEventListener('mouseleave', () => {
      closeTimer = setTimeout(() => dd.open = false, 200);
    });
  }
</script>
</body>
</html>
