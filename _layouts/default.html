<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header" role="banner">
    <div class="wrapper">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Main navigation">
        <details class="nav-dropdown">
          <summary>Contents</summary>
          <ul class="nav-dropdown__list">
            <li><a href="{{ '/preface/' | relative_url }}">Preface</a></li>
            <li><a href="{{ '/chapter1/' | relative_url }}">Chapter 1</a></li>
            <li><a href="{{ '/chapter2/' | relative_url }}">Chapter 2</a></li>
            <li><a href="{{ '/chapter3/' | relative_url }}">Chapter 3</a></li>
            <li><a href="{{ '/chapter4/' | relative_url }}">Chapter 4</a></li>
            <li><a href="{{ '/chapter5/' | relative_url }}">Chapter 5</a></li>
            <li><a href="{{ '/chapter6/' | relative_url }}">Chapter 6</a></li>
            <li><a href="{{ '/chapter7/' | relative_url }}">Chapter 7</a></li>
            <li><a href="{{ '/chapter8/' | relative_url }}">Chapter 8</a></li>
            <li><a href="{{ '/chapter9/' | relative_url }}">Chapter 9</a></li>
          </ul>
        </details>
        <a href="https://press.uchicago.edu/ucp/books/book/chicago/R/bo21933882.html">Buy the book</a>
        <a href="{{ '/fair-use-notice/' | relative_url }}">Fair Use</a>
      </nav>
    </div>
  </header>

  <main id="main-content" class="page-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrapper">
      <p>&copy; 2015 Sean Zdenek &nbsp;&middot;&nbsp; <a href="{{ '/fair-use-notice/' | relative_url }}">Fair Use Notice</a> &nbsp;&middot;&nbsp; <a href="{{ '/accessibility-statement/' | relative_url }}">Accessibility</a></p>
    </div>
  </footer>
<script>
  const dd = document.querySelector('.nav-dropdown');
  if (dd) {
    let closeTimer;
    dd.addEventListener('mouseenter', () => {
      clearTimeout(closeTimer);
      dd.open = true;
    });
    dd.addEventListener('mouseleave', () => {
      closeTimer = setTimeout(() => dd.open = false, 200);
    });
  }
</script>
</body>
</html>
