<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header" role="banner">
    <div class="wrapper">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/book-contents/' | relative_url }}">Contents</a>
        <a href="{{ '/preface/' | relative_url }}">Preface</a>
        <a href="{{ '/chapter1/' | relative_url }}">Chapters</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/fair-use-notice/' | relative_url }}">Fair Use</a>
      </nav>
    </div>
  </header>

  <main id="main-content" class="page-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrapper">
      <p>&copy; {{ 'now' | date: "%Y" }} Sean Zdenek &nbsp;&middot;&nbsp; <a href="{{ '/fair-use-notice/' | relative_url }}">Fair Use Notice</a> &nbsp;&middot;&nbsp; <a href="{{ '/accessibility-statement/' | relative_url }}">Accessibility</a></p>
    </div>
  </footer>
</body>
</html>
