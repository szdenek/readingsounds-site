title: Reading Sounds
tagline: "The ultimate guide to closed captioning"
description: "A companion website for Reading Sounds: Closed-Captioned Media and Popular Culture by Sean Zdenek (University of Chicago Press, 2015)."
email: seanzdenek@gmail.com
url: "https://readingsounds.net"
baseurl: ""
author: Sean Zdenek
image: /assets/images/og-image.jpg

# Build settings — no theme, fully custom layouts
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Permalink structure — use slug directly so /chapter1/ etc. work
permalink: /:slug/

# Tell Jekyll where to find pages
collections:
  pages:
    output: true
    permalink: /:slug/

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
